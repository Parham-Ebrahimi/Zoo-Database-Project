<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <h1>Customer Login</h1>
        <p id="error-message"></p>
        <form id="form" action="customer_login.php" method="POST">
            <div>
                <label for="email-input">
                    <span>@</span>
                </label>
                <input type="email" name="email" id="email-input" placeholder="Email">
            </div>

            <div>
                <label for="password-input">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm296.5-223.5Q560-327 560-360t-23.5-56.5Q513-440 480-440t-56.5 23.5Q400-393 400-360t23.5 56.5Q447-280 480-280t56.5-23.5ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80Z"/></svg>
                </label>
                <input type="password" name="password" id="password-input" placeholder="Password">
            </div>

            <button type="submit">Login</button>
        </form>

        <p>Don't have an account?
            <a href="signup.html">Sign up</a>
        </p>
        <p>Are you an admin?
            <a href="login.html">Admin Login</a>
        </p>
    </div>

    <script>
        const form = document.getElementById('form')
        const email_input = document.getElementById('email-input')
        const password_input = document.getElementById('password-input')
        const error_message = document.getElementById('error-message')

        // Show error from URL query string (e.g. ?error=Invalid...)
        const params = new URLSearchParams(window.location.search)
        if (params.get('error')) {
            error_message.innerText = params.get('error')
        }
        if (params.get('success')) {
            error_message.style.color = 'green'
            error_message.innerText = params.get('success')
        }

        form.addEventListener('submit', (e) => {
            let errors = []

            if (!email_input.value) {
                errors.push("Email is required")
                email_input.parentElement.classList.add('incorrect')
            } else {
                email_input.parentElement.classList.remove('incorrect')
            }

            if (!password_input.value) {
                errors.push("Password is required")
                password_input.parentElement.classList.add('incorrect')
            } else {
                password_input.parentElement.classList.remove('incorrect')
            }

            if (errors.length > 0) {
                e.preventDefault()
                error_message.innerText = errors.join(". ")
            }
        })

        ;[email_input, password_input].forEach(input => {
            input.addEventListener('input', () => {
                if (input.parentElement.classList.contains('incorrect')) {
                    input.parentElement.classList.remove('incorrect')
                    error_message.innerText = ''
                }
            })
        })
    </script>
</body>
</html>
