<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=login.html">
    <title>Redirecting…</title>
    <link rel="canonical" href="login.html">
    <script>
        (function () {
            var base = window.location.pathname.replace(/[^/]+$/, '');
            window.location.replace(base + 'login.html' + window.location.search + window.location.hash);
        })();
    </script>
</head>
<body>
    <p>Login has moved. If you are not redirected, <a href="login.html">go to login</a>.</p>
</body>
</html>
